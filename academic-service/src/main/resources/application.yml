server:
  port: 8082

spring:
  application:
    name: academic-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
