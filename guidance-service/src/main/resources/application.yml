server:
  port: 8083

spring:
  application:
    name: guidance-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:edubio}
    password: ${RABBITMQ_PASSWORD:}

resilience4j:
  circuitbreaker:
    instances:
      academicService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      academicService:
        max-attempts: 2
        wait-duration: 300ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
