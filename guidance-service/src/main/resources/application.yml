server:
  port: 8083

spring:
  application:
    name: guidance-service
  datasource:
    url: jdbc:h2:mem:guidance;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:edubio}
    password: ${RABBITMQ_PASSWORD:edubio123}

resilience4j:
  circuitbreaker:
    instances:
      academicService:
        sliding-window-size: 5
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      academicService:
        max-attempts: 2
        wait-duration: 300ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
