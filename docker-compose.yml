services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: edubio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-edubio123}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  discovery-server:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: discovery-server
    container_name: edubio-discovery
    ports:
      - "8761:8761"

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: auth-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-this-local-demo-secret-32-characters-minimum}
    depends_on:
      - discovery-server
    expose:
      - "8081"

  academic-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: academic-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    expose:
      - "8082"

  guidance-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: guidance-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-edubio123}
    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_started
      academic-service:
        condition: service_started
    expose:
      - "8083"

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: notification-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-edubio}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-edubio123}
    depends_on:
      rabbitmq:
        condition: service_healthy
      discovery-server:
        condition: service_started
    expose:
      - "8084"

  analytics-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: analytics-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    expose:
      - "8085"

  import-service:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: import-service
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
    depends_on:
      - discovery-server
    expose:
      - "8086"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        MODULE: api-gateway
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-this-local-demo-secret-32-characters-minimum}
    depends_on:
      - discovery-server
      - auth-service
      - academic-service
      - guidance-service
      - notification-service
      - analytics-service
      - import-service
    ports:
      - "8080:8080"
