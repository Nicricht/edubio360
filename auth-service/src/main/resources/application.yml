server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}

security:
  jwt:
    secret: ${JWT_SECRET:change-this-local-demo-secret-32-characters-minimum}
    ttl-minutes: 120

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
